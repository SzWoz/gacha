<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="100%" r="90%">
      <stop offset="0" stop-color="#2a1448"/>
      <stop offset="1" stop-color="#07060d"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset=".45" stop-color="#ffc21a"/>
      <stop offset="1" stop-color="#d97800"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- sygnałowe pierścienie -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#7cffd4" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="10 6"/>
  <!-- glitch: przesunięte kopie kryształu -->
  <path d="M32 9 L51 32 L32 55 L13 32 Z" fill="none" stroke="#ff3ea5" stroke-width="3" transform="translate(-2.2 0)" opacity=".85"/>
  <path d="M32 9 L51 32 L32 55 L13 32 Z" fill="none" stroke="#3ee8ff" stroke-width="3" transform="translate(2.2 0)" opacity=".85"/>
  <!-- kryształ ◈ -->
  <g filter="url(#glow)">
    <path d="M32 9 L51 32 L32 55 L13 32 Z" fill="url(#gold)"/>
    <path d="M32 21 L42 32 L32 43 L22 32 Z" fill="#07060d"/>
    <path d="M32 26 L37 32 L32 38 L27 32 Z" fill="#fff1a8"/>
  </g>
  <!-- połysk -->
  <path d="M32 9 L41.5 20.5 L36 22 L32 17 Z" fill="#fff" opacity=".55"/>
</svg>
